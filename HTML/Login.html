<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="../CSS/Login.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="Home.html">HOME</a>
      <a href="Services.html">SERVICES</a>
      <a href="about us.html">ABOUT US</a>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <form class="login-form">
        <input type="text" placeholder="USER NAME" required />
        <input type="password" placeholder="PASSWORD" required />
        
        <div class="phone-input-wrapper">
          <div class="country-prefix">
            +237 <img src="https://flagcdn.com/w40/cm.png" alt="Cameroon Flag">
          </div>
          <input type="tel" class="phone-input" placeholder="PHONE NUMBER" required />
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>

        <p class="signup-text">Don’t have an account?<a href="Signup.html">Sign Up</a></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="contact">
        <p>Contact us:</p>
        <p>+237 658 902 653</p>
      </div>
      <div class="social">
        <p>Follow us:</p>
        <div class="icons">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/X_logo_2023.svg" alt="X logo" />
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook logo" />
        </div>
      </div>
    </div>
    <p class="copyright">@e-Government.All Rights Reserved</p>
  </footer>

</body>
</html>
