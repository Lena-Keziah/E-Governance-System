<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>e-Government Sign Up</title>
  <link rel="stylesheet" href="../CSS/Signup.css"/>
</head>
  <header>
    <nav class="navbar">
      <a href="#">SERVICES</a>
        <a href="Home.html">HOME</a>
      <a href="#">ABOUT US</a>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <form class="signup-form">
        <input type="text" placeholder="USER NAME" required />
        <input type="email" placeholder="EMAIL" required />
        <input type="password" placeholder="PASSWORD" required />
        
        <div class="phone-input-wrapper">
          <div class="country-prefix">
            +237 <img src="https://flagcdn.com/w40/cm.png" alt="Cameroon Flag">
          </div>
          <input type="tel" class="phone-input" placeholder="PHONE NUMBER" required />
        </div>

        <button type="submit" class="sign-in-btn">SIGN IN</button>
        <p class="login-text">Already have an account?<a href="Login.html">Login</a></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="contact">
        <p>Contact us:</p>
        <p>+237 658 902 653</p>
      </div>
      <div class="social">
        <p>Follow us:</p>
        <div class="icons">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/X_logo_2023.svg" alt="X logo" />
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook logo" />
        </div>
      </div>
    </div>
    <p>@e-Government.All Rights Reserved</p>
  </footer>

</body>
</html>
